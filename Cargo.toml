[package]
name = "turnitin_checker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls"] }
base64 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
native-dialog = "0.6"
eframe = "0.24"
egui = "0.24"
egui_plot = "0.24"
rayon = "1.8"
indicatif = "0.17.11"
log = "0.4"
env_logger = "0.10"
futures = "0.3"
crossbeam = "0.8"
num_cpus = "1.16"
rand = "0.8.5"
chrono = "0.4"
once_cell = "1.18"

# Windows-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "winbase"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
